name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ⛔ A WORKFLOW THAT FAILS TO PARSE REPORTS NOTHING AT ALL -- no red cross, no
  # jobs, and `gh pr checks` answers "no checks reported on the branch", which
  # reads exactly like a check that has not started yet. It happened here on
  # 2026-10-05: an edit landed a step inside a two-key `with:` block, orphaning
  # the second key, and the only symptom was a run named after the FILE instead
  # of the workflow. actionlint is the only thing that catches it, so it is the
  # first lane.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  test:
    name: build + vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # ⛔ SAY WHICH TOOLCHAIN RAN. A green check that does not record the
      # compiler behind it makes every figure measured under it unattributable:
      # go.mod said 1.26 on a sibling repository for weeks while its CI asked
      # for `stable` and ran 1.27, and the only way anybody noticed was reading
      # a job log for this line.
      - run: go version
      - name: gofmt
        run: |
          drift=$(gofmt -l .)
          if [ -n "$drift" ]; then echo "::error::not gofmt-clean:"; echo "$drift"; exit 1; fi
      - name: build
        run: CGO_ENABLED=0 go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -timeout 10m ./...

      # ⛔ EVERY STATEMENT OF THE PROGRAM, AND OF THE LIBRARY IT JUDGES WITH.
      # This program coordinates ~25 sessions, and its refusals are the whole
      # product: a branch no test reaches is a refusal nothing holds. Coverage
      # stood at 80.1% (cmd) / 84.6% (both) when #43 measured it, with 174
      # blocks no test entered, and the percentage was never a gate.
      #
      # -coverpkg names BOTH packages, because the lease library is exercised
      # by its own tests and by the command's, and a profile of either alone
      # judges a different set. covblocks counts BLOCKS not entered rather than
      # a percentage, so one new untested branch cannot hide inside a rounding
      # of the other 1,400 statements. --max 0 is the whole contract.
      #
      # internal/modzip is in the list too. Its two unreachable answers --
      # `filepath.Abs` failing, and a `filepath.Dir` that never shortens -- are
      # reached through vars a test replaces, the same way lease.Normalize's
      # step and cmd/agentsync's statFile are, so there is nothing in it this
      # gate has to be excused from.
      - name: coverage, every block entered
        run: |
          set -eu
          go test -timeout 10m -coverpkg=github.com/go-agentsync/agentsync/lease,github.com/go-agentsync/agentsync/cmd/agentsync,github.com/go-agentsync/agentsync/internal/modzip -coverprofile=cover.out ./...
          go install github.com/go-fleettools/fleettools/cmd/covblocks@v0.182.2
          "$(go env GOPATH)/bin/covblocks" --max 0 cover.out

      # ⛔ THE PLATFORM THIS PROGRAM ACTUALLY RUNS ON WAS NEVER COMPILED.
      # Every lane in this file is ubuntu, and the sessions this program
      # coordinates run on a Mac. buildscan said so without reporting a
      # finding: it listed two configurations, both linux/amd64, and no file
      # here is behind a platform constraint -- so there is nothing for it to
      # call uncompiled, and the gap is in the LIST rather than in the
      # findings.
      #
      # `go vet` cross-compiles, so this costs seconds and no second runner.
      # Written out rather than looped, because a configuration hidden in a
      # shell loop is invisible to every instrument that reads workflows.
      # ⛔ And the ARCHITECTURE as well, because `GOOS=darwin` on an ubuntu
      # runner compiles darwin/AMD64 — which buildscan printed, and which is
      # not what this machine is. Covering darwin and covering arm64 is not
      # covering darwin/arm64; that conjunction is how a file in
      # go-compressions/blake3 came to be compiled by no lane at all.
      #
      # One step per configuration, because a named step reports its own
      # status: a red "vet for darwin on arm64" says which platform without
      # anybody opening the log.
      #
      # ⛔ This comment used to give a different reason — that an instrument
      # reading workflows attributes one configuration per STEP, so two
      # invocations in one `run:` block showed up as one. That was true of
      # buildscan when this lane was written and is no longer: it reads per
      # COMMAND since fleettools v0.20.0, and the fix also taught it that a
      # `cd` on its own line and a `(cd x && …)` subshell are where a command
      # compiles. A workflow shaped around a tool's limitation should say so,
      # and should stop saying so when the tool is fixed — otherwise the next
      # reader inherits a constraint that no longer exists.
      - name: vet for darwin on arm64
        run: GOOS=darwin GOARCH=arm64 go vet ./...
      - name: vet for darwin on amd64
        run: GOOS=darwin GOARCH=amd64 go vet ./...
      - name: vet for windows
        run: GOOS=windows go vet ./...

      # ⛔ NOTHING HERE ASKED ABOUT VULNERABILITIES. This module has no
      # dependencies, which is exactly why it went unasked -- and the standard
      # library is a dependency. Scanned by hand on 2026-10-17 it reported
      # nine advisories with a RELEASED fix in go1.27.2, against a go.mod that
      # said 1.27.1. None is called from here; the point is that nobody could
      # have known either way. This program is the coordination floor for every
      # session on that machine, so "nobody asked" is the wrong state for it.
      #
      # ⛔ NO `set -o pipefail`, deliberately. govulncheck exits non-zero over
      # findings it has decided this module does not call, and zero over some
      # it has -- which is the whole reason vulngate exists. An unread scan is
      # caught instead by the emptiness check below and by vulngate, which
      # believes a run only when it carried a config AND an SBOM.
      #
      # ⛔ -go holds the scan to the toolchain that actually ran: the standard
      # library is judged by one version, and a lane that silently resolved
      # another answers a different question.
      - name: govulncheck, judged by vulngate
        run: |
          set -eu
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # ⛔ The pin is bumped for the NOTE, not for the judgment. Measured
          # 2026-10-18: cmd/vulngate and internal/fleet are byte-identical
          # between v0.18.1 and v0.20.1 -- built with -buildvcs=false the two
          # binaries have the same sha256 -- so the four intervening commits
          # cannot change what this step reports. What v0.18.1 DOES do is print
          # "STALE -- v0.18.1 is 4 commit(s) behind ... Those commits may change
          # what this pass reports" on every run, which is true about the count
          # and false about the consequence. A warning that cannot matter is the
          # one that teaches people to read past the warnings that can.
          #
          # ⛔ THAT REASONING DOES NOT CARRY TO THIS BUMP, and the only way to
          # know was to measure it again. v0.152.0 -> v0.156.0, both built with
          # -buildvcs=false on 2026-11-22:
          #
          #   6ac2645be0863d56c371b370eea22ffd4479992b761f8714db58dbaedf2fdba6  v0.152.0
          #   e3658555cfb04f01a1f12435b175c2fd326e21e892d7dd04e3f03353f1274711  v0.156.0
          #
          # DIFFERENT. So this pin was not bumped for the note: the judge itself
          # changed, and what this step reports may change with it. That is the
          # reason to take it -- a gate judging vulnerabilities should be the
          # current one -- but the claim above must not be extended to it by
          # analogy. CI is the authority on the verdict, as always.
          go install github.com/go-fleettools/fleettools/cmd/vulngate@v0.182.2
          BIN="$(go env GOPATH)/bin"
          "$BIN/govulncheck" -format json ./... > /tmp/vuln.json || true
          test -s /tmp/vuln.json || { echo "::error::govulncheck wrote nothing at all"; exit 1; }
          "$BIN/vulngate" -go "$(go env GOVERSION)" /tmp/vuln.json

  # ⛔ NOTHING FED THESE PARSERS ANYTHING BUT WHAT THEIR AUTHOR THOUGHT OF.
  # Measured 2026-11-22: `git grep "func Fuzz"` returned nothing and there was no
  # testdata/ anywhere, in the program ~25 sessions on one machine coordinate
  # through. Its inputs are not its own: a lease file another session may have
  # half-written, a message log, a records file, and the PreToolUse/PostToolUse
  # payload carrying the command line the gate judges. `go test` already replays
  # every committed seed (testdata/fuzz/<Target>/, the layout
  # go-agentsync/agentscope uses) in the test lane above; this lane is the part
  # that GENERATES inputs, for a bounded time.
  #
  # ⛔ The two gate targets assert what the gate is FOR -- a publish into a
  # repository nobody holds is denied, a lease is released only by a finishing
  # command -- not merely that it does not crash; "did not crash" passes both
  # defects fixed on 2026-11-22. They are built from decisions made before the
  # gate runs, so a gate that is wrong cannot also be the oracle.
  #
  # `go test -fuzz` takes ONE target in ONE package, so one step per target, each
  # naming its own status: a red "fuzz FuzzGatePost" says which parser. `-run '^$'`
  # keeps the ordinary tests from re-running nine times; go itself refuses a
  # -fuzz pattern that matches no target, so a renamed one fails here instead of
  # passing on nothing. 20 s each, nine targets: about three minutes. A crasher
  # the run finds is written under testdata/fuzz/ and is committed with its fix,
  # which turns it into a seed every `go test` replays from then on.
  fuzz:
    name: fuzz (bounded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go version
      - name: fuzz FuzzParseLease
        run: go test -run '^$' -fuzz '^FuzzParseLease$' -fuzztime 20s ./lease
      - name: fuzz FuzzParseTells
        run: go test -run '^$' -fuzz '^FuzzParseTells$' -fuzztime 20s ./lease
      - name: fuzz FuzzParseTakes
        run: go test -run '^$' -fuzz '^FuzzParseTakes$' -fuzztime 20s ./lease
      - name: fuzz FuzzNormalizePath
        run: go test -run '^$' -fuzz '^FuzzNormalizePath$' -fuzztime 20s ./lease
      - name: fuzz FuzzParseRecords
        run: go test -run '^$' -fuzz '^FuzzParseRecords$' -fuzztime 20s ./cmd/agentsync
      - name: fuzz FuzzGateHook
        run: go test -run '^$' -fuzz '^FuzzGateHook$' -fuzztime 20s ./cmd/agentsync
      - name: fuzz FuzzGateHookPayload
        run: go test -run '^$' -fuzz '^FuzzGateHookPayload$' -fuzztime 20s ./cmd/agentsync
      - name: fuzz FuzzGatePost
        run: go test -run '^$' -fuzz '^FuzzGatePost$' -fuzztime 20s ./cmd/agentsync
      - name: fuzz FuzzGatePostPayload
        run: go test -run '^$' -fuzz '^FuzzGatePostPayload$' -fuzztime 20s ./cmd/agentsync
