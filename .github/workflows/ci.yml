name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ⛔ A WORKFLOW THAT FAILS TO PARSE REPORTS NOTHING AT ALL -- no red cross, no
  # jobs, and `gh pr checks` answers "no checks reported on the branch", which
  # reads exactly like a check that has not started yet. It happened here on
  # 2026-10-05: an edit landed a step inside a two-key `with:` block, orphaning
  # the second key, and the only symptom was a run named after the FILE instead
  # of the workflow. actionlint is the only thing that catches it, so it is the
  # first lane.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  test:
    name: build + vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # ⛔ SAY WHICH TOOLCHAIN RAN. A green check that does not record the
      # compiler behind it makes every figure measured under it unattributable:
      # go.mod said 1.26 on a sibling repository for weeks while its CI asked
      # for `stable` and ran 1.27, and the only way anybody noticed was reading
      # a job log for this line.
      - run: go version
      - name: gofmt
        run: |
          drift=$(gofmt -l .)
          if [ -n "$drift" ]; then echo "::error::not gofmt-clean:"; echo "$drift"; exit 1; fi
      - name: build
        run: CGO_ENABLED=0 go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -timeout 10m ./...

      # ⛔ NOTHING HERE ASKED ABOUT VULNERABILITIES. This module has no
      # dependencies, which is exactly why it went unasked -- and the standard
      # library is a dependency. Scanned by hand on 2026-10-17 it reported
      # nine advisories with a RELEASED fix in go1.27.2, against a go.mod that
      # said 1.27.1. None is called from here; the point is that nobody could
      # have known either way. This program is the coordination floor for every
      # session on that machine, so "nobody asked" is the wrong state for it.
      #
      # ⛔ NO `set -o pipefail`, deliberately. govulncheck exits non-zero over
      # findings it has decided this module does not call, and zero over some
      # it has -- which is the whole reason vulngate exists. An unread scan is
      # caught instead by the emptiness check below and by vulngate, which
      # believes a run only when it carried a config AND an SBOM.
      #
      # ⛔ -go holds the scan to the toolchain that actually ran: the standard
      # library is judged by one version, and a lane that silently resolved
      # another answers a different question.
      - name: govulncheck, judged by vulngate
        run: |
          set -eu
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/go-fleettools/fleettools/cmd/vulngate@v0.18.1
          BIN="$(go env GOPATH)/bin"
          "$BIN/govulncheck" -format json ./... > /tmp/vuln.json || true
          test -s /tmp/vuln.json || { echo "::error::govulncheck wrote nothing at all"; exit 1; }
          "$BIN/vulngate" -go "$(go env GOVERSION)" /tmp/vuln.json
